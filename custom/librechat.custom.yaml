rateLimits:
  fileUploads:
    ipMax: 100
    ipWindowInMinutes: 60  # Rate limit window for file uploads per IP
    userMax: 50
    userWindowInMinutes: 60  # Rate limit window for file uploads per user
  conversationsImport:
    ipMax: 100
    ipWindowInMinutes: 60  # Rate limit window for conversation imports per IP
    userMax: 50
    userWindowInMinutes: 60  # Rate limit window for conversation imports per user

# Example Actions Object Structure
actions:
  allowedDomains:
    - 'swapi.dev'
    - 'librechat.ai'
    - 'google.com'

# MCP Servers Configuration - Matching Working Cursor Config
mcpServers:
  didi-mcp:
    # DiDi documentation specifies Streamable HTTP protocol
    type: streamable-http
    url: "https://mcp.didichuxing.com/mcp-servers?key={{DIDI_API_KEY}}"
    headers:
      Content-Type: "application/json; charset=utf-8"
      User-Agent: "LibreChat-MCP/1.0"
      Accept: "application/json"
      X-API-Key: "{{DIDI_API_KEY}}"
    customUserVars:
      DIDI_API_KEY:
        title: "DiDi MCP API Key"
        description: "Enter your DiDi MCP API key to access DiDi travel and transportation services. Get your key from the DiDi MCP console after registration."
    startup: false
    initTimeout: 30000  # 30 seconds for initialization  
    timeout: 120000     # 2 minutes for operations (increased from 1 minute)
  
  amap-amap-sse:
    # Let LibreChat auto-detect transport type (like Cursor does)  
    url: "https://mcp.amap.com/sse?key={{AMAP_API_KEY}}"
    customUserVars:
      AMAP_API_KEY:
        title: "Amap API Key"
        description: "Enter your Amap API key to access location, mapping, and navigation services. You can obtain your API key from the Amap developer console."
    startup: false
    timeout: 60000
  
  akshare-one-mcp:
    # Self-hosted AKShare MCP server for Chinese financial data
    type: streamable-http
    url: "http://akshare_mcp:8081/mcp"
    headers:
      Content-Type: "application/json; charset=utf-8"
      Accept: "application/json, text/event-stream"
    startup: false
    timeout: 60000

# Definition of custom endpoints
endpoints:
  # assistants:
  #   disableBuilder: false # Disable Assistants Builder Interface by setting to `true`
  #   pollIntervalMs: 3000  # Polling interval for checking assistant updates
  #   timeoutMs: 180000  # Timeout for assistant operations
  #   # Should only be one or the other, either `supportedIds` or `excludedIds`
  #   supportedIds: ["asst_supportedAssistantId1", "asst_supportedAssistantId2"]
  #   # excludedIds: ["asst_excludedAssistantId"]
  #   # Only show assistants that the user created or that were created externally (e.g. in Assistants playground).
  #   # privateAssistants: false # Does not work with `supportedIds` or `excludedIds`
  #   # (optional) Models that support retrieval, will default to latest known OpenAI models that support the feature
  #   retrievalModels: ["gpt-4-turbo-preview"]
  #   # (optional) Assistant Capabilities available to all users. Omit the ones you wish to exclude. Defaults to list below.
  #   capabilities: ["code_interpreter", "retrieval", "actions", "tools", "image_vision"]
  agents:
    # Enable agents for MCP tools access (REQUIRED for MCP functionality)
    recursionLimit: 50
    maxRecursionLimit: 100
    disableBuilder: false
    maxCitations: 30
    maxCitationsPerFile: 7
    minRelevanceScore: 0.45
  custom:
    # OpenRouter Example
    - name: 'OpenRouter'
      # For `apiKey` and `baseURL`, you can use environment variables that you define.
      # recommended environment variables:
      apiKey: '${OPENROUTER_KEY}'
      baseURL: 'https://openrouter.ai/api/v1'
      headers:
          x-librechat-body-parentmessageid: '{{LIBRECHAT_BODY_PARENTMESSAGEID}}'
      models:
        default: ['anthropic/claude-sonnet-4']
        fetch: true
      titleConvo: true
      titleModel: 'anthropic/claude-sonnet-4'
      # Recommended: Drop the stop parameter from the request as Openrouter models use a variety of stop tokens.
      dropParams: ['stop']
      modelDisplayLabel: 'OpenRouter'

   
